name: Android

on:
  push:
    branches: [main, feature/pre-release-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android lint
        run: gradle -p android lintCustomerRelease lintBusinessRelease

      - name: Build test APKs
        run: gradle -p android assembleCustomerDebug assembleBusinessDebug

      - name: Build release AABs
        run: gradle -p android bundleCustomerRelease bundleBusinessRelease

      - name: Upload customer Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dierb-online-android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/customer/debug/*.apk
            android/app/build/outputs/bundle/customerRelease/*.aab

      - name: Upload business Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dierb-business-android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/business/debug/*.apk
            android/app/build/outputs/bundle/businessRelease/*.aab
