name: Probe Production To File

on:
  push:
    branches: [main]
    paths:
      - probe-trigger.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe public production
        env:
          BASE_URL: https://dierb-negm.vercel.app
        run: |
          probe() { curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL$1" || echo 000; }
          root=$(probe /)
          register=$(probe /register)
          health=$(probe /api/health)
          assetlinks=$(probe /.well-known/assetlinks.json)
          health_body=$(curl -L -sS --max-time 20 "$BASE_URL/api/health" | tr -d '\n' | head -c 500 || true)
          printf 'sha=%s\nroot=%s\nregister=%s\nhealth=%s\nassetlinks=%s\nhealth_body=%s\n' "$GITHUB_SHA" "$root" "$register" "$health" "$assetlinks" "$health_body" > production-probe-result.txt
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production-probe-result.txt
          git commit -m 'chore: record production probe result [skip ci]' || exit 0
          git push origin HEAD:main
