name: CI
on: [push, pull_request]
permissions:
  contents: read
  statuses: write
  issues: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: derb
          POSTGRES_USER: derb
          POSTGRES_PASSWORD: derb_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U derb -d derb"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://derb:derb_ci_only@localhost:5432/derb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  production_probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Probe production
        id: probe
        env:
          BASE_URL: https://dierb-negm.vercel.app
        run: |
          probe() { curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL$1" || echo 000; }
          root=$(probe /)
          register=$(probe /register)
          health=$(probe /api/health)
          assetlinks=$(probe /.well-known/assetlinks.json)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "register=$register" >> "$GITHUB_OUTPUT"
          echo "health=$health" >> "$GITHUB_OUTPUT"
          echo "assetlinks=$assetlinks" >> "$GITHUB_OUTPUT"
          ok=1
          for code in "$root" "$register" "$health" "$assetlinks"; do case "$code" in 2*|3*) ;; *) ok=0 ;; esac; done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Publish probe details
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: Production probe on ${{ github.sha }}: root=${{ steps.probe.outputs.root }}, register=${{ steps.probe.outputs.register }}, health=${{ steps.probe.outputs.health }}, assetlinks=${{ steps.probe.outputs.assetlinks }}
        run: |
          python -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))' > /tmp/comment.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -d @/tmp/comment.json

      - name: Publish production probe status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          OK: ${{ steps.probe.outputs.ok }}
        run: |
          if [ "$OK" = "1" ]; then state=success; description='Production routes and health are reachable'; else state=failure; description='Production probe failed'; fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"Production Probe\",\"description\":\"${description}\"}"
          [ "$OK" = "1" ]
