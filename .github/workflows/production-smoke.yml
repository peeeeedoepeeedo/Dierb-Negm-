name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production routes
        id: probe
        env:
          BASE_URL: https://dierb-negm.vercel.app
        run: |
          set -u
          probe() {
            local path="$1"
            curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL$path" || echo 000
          }
          root=$(probe /)
          register=$(probe /register)
          health=$(probe /api/health)
          assetlinks=$(probe /.well-known/assetlinks.json)
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "register=$register" >> "$GITHUB_OUTPUT"
          echo "health=$health" >> "$GITHUB_OUTPUT"
          echo "assetlinks=$assetlinks" >> "$GITHUB_OUTPUT"
          echo "root=$root register=$register health=$health assetlinks=$assetlinks"
          ok=1
          for code in "$root" "$register" "$health" "$assetlinks"; do
            case "$code" in 2*|3*) ;; *) ok=0 ;; esac
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Publish diagnostic comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.probe.outputs.root }}
          REGISTER: ${{ steps.probe.outputs.register }}
          HEALTH: ${{ steps.probe.outputs.health }}
          ASSETLINKS: ${{ steps.probe.outputs.assetlinks }}
        run: |
          body="Production probe on ${GITHUB_SHA}: root=${ROOT:-unknown}, register=${REGISTER:-unknown}, health=${HEALTH:-unknown}, assetlinks=${ASSETLINKS:-unknown}"
          python -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))' > /tmp/comment.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1/comments" \
            -d @/tmp/comment.json
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.probe.outputs.root }}
          REGISTER: ${{ steps.probe.outputs.register }}
          HEALTH: ${{ steps.probe.outputs.health }}
          ASSETLINKS: ${{ steps.probe.outputs.assetlinks }}
          BODY: Production probe on ${{ github.sha }}: root=${{ steps.probe.outputs.root }}, register=${{ steps.probe.outputs.register }}, health=${{ steps.probe.outputs.health }}, assetlinks=${{ steps.probe.outputs.assetlinks }}

      - name: Publish production smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          OK: ${{ steps.probe.outputs.ok }}
        run: |
          if [ "$OK" = "1" ]; then state=success; description='Production routes and health are reachable'; else state=failure; description='Production smoke test failed'; fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"Production Smoke\",\"description\":\"${description}\"}"
          [ "$OK" = "1" ]
