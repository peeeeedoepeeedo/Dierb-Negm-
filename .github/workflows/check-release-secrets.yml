name: Check Release Secret Availability

on:
  push:
    branches: [main]
    paths:
      - secret-check-trigger.txt

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record presence only
        run: |
          : > secret-check-result.txt
          for n in DATABASE_URL SESSION_SECRET VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID NEON_API_KEY POSTGRES_URL S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            if [ -n "${!n:-}" ]; then echo "$n=present"; echo "$n=present" >> secret-check-result.txt; else echo "$n=missing"; echo "$n=missing" >> secret-check-result.txt; fi
          done
      - name: Commit presence report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add secret-check-result.txt
          git commit -m 'chore: record release secret availability [skip ci]' || exit 0
          git push origin HEAD:main
